augmentation_args:
  flip:
    description: Flipping
    value: false
  gaussian_noise:
    description: Gaussian_noise
    value: false
  illuminate:
    description: Illumination changes
    value: false
  rotate:
    description: Rotation
    value: false
  translate:
    description: Translation
    value: false
dataset:
  description: Dataset class
  value: SpotsDataset
dataset_args:
  cell_size:
    description: Size of one cell in the grid
    value: 4
  name:
    description: Dataset.npz file
    value: /tachyon/scratch/gmicro/soucemma/datasets/deepblink_dataset.npz
  smooth_factor:
    description: True label smoothing factor
    value: 1
loss:
  description: Loss function
  value: combined_dice_rmse
model:
  description: Name of the model class
  value: SpotsModel
name:
  description: Wandb/model name
  value: deepBlink
network:
  description: Network architecture function
  value: unet
network_args:
  block:
    description: Basic architectural block
    value: convolutional
  dropout:
    description: Fraction of input units to drop
    value: 0.3
  filters:
    description: 2 ** filters in the first layer
    value: 5
  l2:
    description: L2 regularization factor
    value: 1.0e-06
  ndown:
    description: Network depth (encoding steps)
    value: 2
optimizer:
  description: Optimizer function
  value: amsgrad
run_name:
  description: Current run
  value: deepBlink_is_sweet
savedir:
  description: Model saving path
  value: /tachyon/scratch/gmicro/soucemma/repos/spot-detection-benchmark/models/model_deepblink/
train_args:
  batch_size:
    description: Samples per mini-batch
    value: 6
  epochs:
    description: Total rounds of training
    value: 200
  learning_rate:
    description: Learning rate
    value: 0.0001
  overfit:
    description: Single batch overfitting
    value: false
  pre_train:
    description: Path to pre-trained model to fine-tune
    value: null
use_wandb:
  description: If wandb.ai should be used
  value: false
